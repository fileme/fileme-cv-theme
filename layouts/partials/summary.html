
<div class="py-3">
    <div class="media flex-column flex-md-row align-items-center">
        <div class="row">
            <div class="col-12 col-md-8 order-2 order-md-1">
                <div class="media-body text-left">
                    <div class="mb-0">{{ .BasicInfo.Profile | markdownify }}</div>
                </div>
            </div>
            <div id="pic" class="col-12 col-md-4 order-1 order-md-2 mb-3 mb-md-0 text-center text-md-right">
                <div class="card shadow-sm d-inline-block text-center" style="max-width: 260px;">
                    <div class="card-body">
                        {{ with .BasicInfo.Photo }}
                        <img src="{{ . | relURL }}" alt="{{ $.BasicInfo.Name }}" class="rounded-circle mb-3" width="120" height="120">
                        {{ end }}
                        <h5 class="card-title mb-1">{{ .BasicInfo.Name }}</h5>
                        {{ with index .Experience 0 }}
                        <p class="card-text text-muted small mb-3">{{ (index .Positions 0).Title | safeHTML }} at {{ .Employer | safeHTML }}</p>
                        {{ end }}
                        {{ with .BasicInfo.LinkedInHandle }}
                        <a class="btn btn-sm text-white" style="background-color: #0a66c2;" href="https://www.linkedin.com/in/{{ . }}" target="_blank" rel="noopener noreferrer">
                            <i class="fab fa-linkedin fa-fw mr-1"></i>View profile
                        </a>
                        {{ end }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
