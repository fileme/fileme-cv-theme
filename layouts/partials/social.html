<div class="cv-social text-center">
    <ul class="list-inline mx-auto mb-0">
        {{ range .BasicInfo.Social }}
            <li class="list-inline-item mx-2">
                <a target="_blank" rel="noopener noreferrer" href="{{ .Url | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}>
                    <i class="{{ .Icon }} fa-2x"></i>
                </a>
            </li>
        {{ end }}
    </ul>
</div>
